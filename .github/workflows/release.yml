name: Release candidate validation

on:
  push:
    tags:
      - "v*-candidate.*"
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  proofs:
    uses: ./.github/workflows/proofs.yml

  identity:
    uses: ./.github/workflows/identity.yml

  frozen-candidate:
    name: Validate frozen candidate
    needs: [ci, proofs, identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - name: Install SDK dependencies
        run: pnpm --dir sdk install --frozen-lockfile --ignore-scripts
      - name: Verify tag and package identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME#v}"
          test "$candidate" = "$(node -p "require('./evidence/release-manifest.json').candidate")"
          test "$candidate" = "$(node -p "require('./sdk/package.json').version")"
          test "$candidate" = "$(node -e "const fs=require('fs'); const text=fs.readFileSync('CITATION.cff','utf8'); const match=text.match(/^version:\s*[\"']?([^\"'\r\n]+)[\"']?$/m); if(!match) process.exit(1); process.stdout.write(match[1])")"
      - name: Build artifacts
        run: forge build
      - name: Regenerate candidate manifest
        run: node scripts/generate-release-manifest.mjs
      - name: Verify release binding
        run: node scripts/verify-release.mjs --mode=full
      - name: Verify public repository surface
        run: |
          node scripts/verify-links.mjs
          node scripts/verify-public-surface.mjs
          node scripts/verify-repository-health.mjs
      - name: Check manifest determinism
        run: git diff --exit-code -- evidence/release-manifest.json

  # Publishing a GitHub Release remains a separate explicit maintainer action.
