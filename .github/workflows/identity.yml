name: Release identity

on:
  pull_request:
  workflow_call:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity:
    name: Release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Verify license boundaries
        shell: bash
        run: |
          test "$(sed -n '3p' LICENSE)" = "Copyright (c) 2026 Oraclizer Labs, Inc."
          test "$(sed -n '3p' sdk/LICENSE)" = "Copyright (c) 2026 Oraclizer Labs, Inc."
          grep -Fq "MIT License for four historical pilot source files" README.md
          grep -Fq "Copyright and related rights waived via [CC0](LICENSE-CC0.md)." docs/ERC-DRAFT.md
          grep -Fq "date-released: 2026-09-01" CITATION.cff
          grep -Fq "license: BSD-3-Clause" CITATION.cff
          for path in \
            pilot/src/TrustFreezePilot.sol \
            pilot/src/MockBoundPolicy.sol \
            pilot/test/TrustFreezePilot.t.sol \
            pilot/kontrol/TrustFreezePilotTest.t.sol; do
            test "$(sed -n '1p' "$path")" = "// SPDX-License-Identifier: MIT"
            grep -Fq -- "- \`$path\`" README.md
          done
          test "$(git grep -l 'SPDX-License-Identifier: MIT' -- '*.sol' | sort)" = \
            "$(printf '%s\n' \
              pilot/kontrol/TrustFreezePilotTest.t.sol \
              pilot/src/MockBoundPolicy.sol \
              pilot/src/TrustFreezePilot.sol \
              pilot/test/TrustFreezePilot.t.sol | sort)"
      - name: Verify current-profile release index
        run: node scripts/verify-current-profile-release-v2.mjs
      - name: Verify public release tree
        run: node scripts/verify-public-release-tree.mjs
      - name: Verify public surface
        run: node scripts/verify-public-surface.mjs
      - name: Verify repository health
        run: node scripts/verify-repository-health.mjs
