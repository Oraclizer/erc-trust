name: Release identity

on:
  pull_request:
  workflow_call:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity:
    name: Release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Verify current-profile release index
        run: node scripts/verify-current-profile-release-v2.mjs
      - name: Verify public release tree
        run: node scripts/verify-public-release-tree.mjs
      - name: Verify public surface
        run: node scripts/verify-public-surface.mjs
      - name: Verify repository health
        run: node scripts/verify-repository-health.mjs
