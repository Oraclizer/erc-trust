name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  implementation:
    name: Foundry implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Show toolchain
        run: forge --version
      - name: Check formatting
        run: forge fmt --check
      - name: Build and enforce size gate
        run: forge build --sizes --skip TrustTokenC
      - name: Run unit, fuzz, and invariant tests
        run: forge test -vv
        env:
          FOUNDRY_FUZZ_RUNS: "256"
          FOUNDRY_INVARIANT_RUNS: "256"
          FOUNDRY_INVARIANT_DEPTH: "500"
      - name: Lint Solidity
        run: forge lint

  sdk-and-package:
    name: SDK and repository package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Install SDK dependencies
        run: pnpm --dir sdk install --frozen-lockfile --ignore-scripts
      - name: Test SDK
        run: pnpm --dir sdk test
      - name: Regenerate conformance vectors
        run: node scripts/generate-vectors.mjs
      - name: Check vector determinism
        run: git diff --exit-code -- vectors/conformance-v1.json
      - name: Build release artifacts
        run: forge build
      - name: Recompute pure runtime fixture
        run: node scripts/generate-pure-runtime-fixture.mjs --check
      - name: Replay runtime semantic qualification
        run: node scripts/verify-runtime-binding.mjs --check-receipt
      - name: Regenerate release manifest
        run: node scripts/generate-release-manifest.mjs
      - name: Verify release binding
        run: node scripts/verify-release.mjs --mode=${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      - name: Check manifest determinism
        run: git diff --exit-code -- evidence/release-manifest.json
      - name: Verify local links
        run: node scripts/verify-links.mjs
      - name: Verify public surface
        run: node scripts/verify-public-surface.mjs
      - name: Verify repository health
        run: node scripts/verify-repository-health.mjs

  release-identity:
    name: Release tree identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Verify current-profile release index
        run: node scripts/verify-current-profile-release-v2.mjs
      - name: Verify public release tree
        run: node scripts/verify-public-release-tree.mjs

  required:
    name: required
    if: ${{ always() }}
    needs: [implementation, sdk-and-package, release-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          IMPLEMENTATION_RESULT: ${{ needs.implementation.result }}
          SDK_RESULT: ${{ needs.sdk-and-package.result }}
          IDENTITY_RESULT: ${{ needs.release-identity.result }}
        run: |
          test "$IMPLEMENTATION_RESULT" = success
          test "$SDK_RESULT" = success
          test "$IDENTITY_RESULT" = success
