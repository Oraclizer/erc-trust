name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof-selection-observation:
    name: Observe proof state selection
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/proof-reuse-selection' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe frozen PR selection using the job token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { selectPrArtifact, eligibleRun } from './scripts/proof-ci.mjs';
          const repository = 'Oraclizer/erc-trust';
          const commit = 'b86d140e81bc12be6b6f8c257a1489e128cf5883';
          const identity = {
            profile: '42938a71882ac09bec0fee9913d35342f1443ffe1e59e8f579a5ce80e14a433f',
            source: '111db7bc12adb33e7d86dc3b186978dc582362979e2476cf8a048925572acd67',
          };
          const emit = (stage, data) => console.log(JSON.stringify({ stage, ...data }));
          const state = {};
          const rejected = (checks) => Object.entries(checks).filter(([, ok]) => !ok).map(([key]) => key);
          emit('context', { event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF, sha: process.env.GITHUB_SHA, repository: process.env.GITHUB_REPOSITORY, targetCommit: commit, targetPr: 34 });
          const api = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(15000),
            });
            emit('http', { path, status: response.status, requestId: response.headers.get('x-github-request-id'), apiVersion: response.headers.get('x-github-api-version-selected') });
            if (!response.ok) throw new Error(`HTTP ${response.status} at ${path}`);
            const data = await response.json();
            if (path.includes('/commits/')) {
              emit('linked-prs', { count: data.length, numbers: data.map((pr) => pr.number) });
            } else if (/\/pulls\/\d+$/.test(path)) {
              state.pr = data;
              emit('pr', { number: data.number, merged: data.merged, mergeCommit: data.merge_commit_sha, headSha: data.head?.sha, headRepository: data.head?.repo?.full_name, baseRepository: data.base?.repo?.full_name, baseRef: data.base?.ref, association: data.author_association,
                rejected: rejected({ merged: data.merged === true, mergeCommit: data.merge_commit_sha === commit, headRepository: data.head?.repo?.full_name === repository }) });
            } else if (path.includes('/workflows/')) {
              const pr = state.pr;
              state.runs = data.workflow_runs;
              emit('runs', { count: data.workflow_runs.length, candidates: data.workflow_runs.map((run) => ({ id: run.id, attempt: run.run_attempt, actor: run.actor?.login, eligible: eligibleRun(run, pr, repository),
                rejected: rejected({ merged: pr.merged === true, baseRef: pr.base?.ref === 'main', baseRepository: pr.base?.repo?.full_name === repository, headRepository: pr.head?.repo?.full_name === repository, association: ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association), event: run.event === 'pull_request', status: run.status === 'completed', conclusion: run.conclusion === 'success', path: run.path === '.github/workflows/proofs.yml', repository: run.repository?.full_name === repository, runHeadRepository: run.head_repository?.full_name === repository, headSha: run.head_sha === pr.head.sha, supplementalPr: Array.isArray(run.pull_requests) && (run.pull_requests.length === 0 || run.pull_requests.some((item) => item.number === pr.number)) }),
                values: { event: run.event, status: run.status, conclusion: run.conclusion, path: run.path, repository: run.repository?.full_name, headRepository: run.head_repository?.full_name, headSha: run.head_sha, supplementalPr: run.pull_requests } })) });
            } else if (path.endsWith('/permission')) {
              emit('permission', { path, permission: data.permission, allowed: ['admin', 'maintain', 'write'].includes(data.permission) });
            } else if (path.includes('/artifacts?')) {
              const runId = Number(path.match(/\/runs\/(\d+)\//)[1]);
              const run = state.runs.find((item) => item.id === runId);
              const expectedName = `isabelle-state-${identity.profile}-${identity.source}-${run.run_attempt}`;
              emit('artifacts', { runId, expectedName, count: data.artifacts.length, candidates: data.artifacts.map((item) => ({ id: item.id, name: item.name, expired: item.expired, workflowRunId: item.workflow_run?.id,
                rejected: rejected({ name: item.name === expectedName, unexpired: !item.expired, run: item.workflow_run?.id === run.id }) })) });
            }
            return data;
          };
          const selected = await selectPrArtifact(api, repository, commit, identity);
          emit('selection', { selected });
          NODE

  implementation:
    name: Foundry implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Show toolchain
        run: forge --version
      - name: Check formatting
        run: forge fmt --check
      - name: Build and enforce size gate
        run: forge build --sizes
      - name: Run unit, fuzz, and invariant tests
        run: forge test -vv
        env:
          FOUNDRY_FUZZ_RUNS: "256"
          FOUNDRY_INVARIANT_RUNS: "256"
          FOUNDRY_INVARIANT_DEPTH: "500"
      - name: Lint Solidity
        run: forge lint
      - name: Check mutation anchors and detectors
        shell: pwsh
        run: ./scripts/run-mutations.ps1 -PreflightOnly
      - name: Exercise mutation-definition binding negatives
        run: node scripts/test-mutation-definition-binding.mjs

  sdk-and-package:
    name: SDK and repository package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Install SDK dependencies
        run: pnpm --dir sdk install --frozen-lockfile --ignore-scripts
      - name: Test SDK
        run: pnpm --dir sdk test
      - name: Pack, install, and consume the SDK package
        run: pnpm --dir sdk smoke:package
      - name: Regenerate conformance vectors
        run: node scripts/generate-vectors.mjs
      - name: Check vector determinism
        run: git diff --exit-code -- vectors/conformance-v1.json
      - name: Check normative kernel generation determinism
        run: node scripts/generate-normative-kernel.mjs --check
      - name: Verify the generated receipt schema against vectors and Solidity
        run: node scripts/verify-receipt-schema.mjs
      - name: Rerun the independent specification-only reproduction and compare its receipt
        run: |
          node scripts/independent-reproduction-v3.mjs --vectors vectors/conformance-v2.json --ethers sdk/node_modules/ethers --schema spec/erc-trust-kernel-v2.json --abi spec/generated/kernel-v2-abi.json --out "$RUNNER_TEMP/independent-reproduction-v3.json" > /dev/null
          diff -q "$RUNNER_TEMP/independent-reproduction-v3.json" evidence/independent-reproduction-v3.json
      - name: Build release artifacts
        run: forge build
      - name: Check runtime bridge generation determinism
        run: node scripts/generate-runtime-bridge-v2.mjs --check
      - name: Check the two-layer runtime binding (pinned-compiler replay)
        run: node scripts/generate-runtime-binding-v3.mjs --check
      - name: Verify the runtime binding receipt
        run: node scripts/verify-runtime-binding-v3.mjs --replay
      - name: Compile the generated kernel interface with the pinned compiler
        run: node scripts/verify-normative-kernel-solidity.mjs
      - name: Regenerate release manifest
        run: node scripts/generate-release-manifest.mjs
      - name: Verify release binding
        run: node scripts/verify-release.mjs --mode=${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      - name: Check manifest determinism
        run: git diff --exit-code -- evidence/release-manifest.json
      - name: Verify successor evidence lanes
        run: node scripts/verify-current-profile-release-v3.mjs
      - name: Exercise evidence-verifier negative controls
        run: node scripts/verify-current-profile-release-v3.mjs --self-test
      - name: Verify the obligation ledger
        run: node scripts/verify-obligation-ledger-v3.mjs
      - name: Verify local links
        run: node scripts/verify-links.mjs
      - name: Verify public surface
        run: node scripts/verify-public-surface.mjs
      - name: Verify repository health
        run: node scripts/verify-repository-health.mjs
      - name: Exercise proof reuse policy without proof computation
        run: node scripts/test-proof-ci.mjs

  release-identity:
    name: Release tree identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Verify successor evidence lanes
        run: node scripts/verify-current-profile-release-v3.mjs
      - name: Verify the obligation ledger
        run: node scripts/verify-obligation-ledger-v3.mjs
      - name: Verify public release tree
        run: node scripts/verify-public-release-tree.mjs

  required:
    name: required
    if: ${{ always() }}
    needs: [implementation, sdk-and-package, release-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          IMPLEMENTATION_RESULT: ${{ needs.implementation.result }}
          SDK_RESULT: ${{ needs.sdk-and-package.result }}
          IDENTITY_RESULT: ${{ needs.release-identity.result }}
        run: |
          test "$IMPLEMENTATION_RESULT" = success
          test "$SDK_RESULT" = success
          test "$IDENTITY_RESULT" = success
