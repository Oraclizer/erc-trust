name: Implementation bug
description: Report a reproducible implementation, test, or SDK defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report exploitable vulnerabilities here; use the private security advisory channel.
  - type: input
    id: commit
    attributes:
      label: Exact commit
      placeholder: 40-character Git commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, request fields, and observed state or receipt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - Native Full v1
        - ERC-3643 Verified Full v1
        - Pilot
        - SDK/schema/vectors
        - Formal evidence
        - Unknown
    validations:
      required: true
