<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1440" viewBox="0 0 600 1440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ao-title ao-desc">
  <title id="ao-title">ERC-TRUST action flow for mobile screens</title>
  <desc id="ao-desc">A vertical three-stage flow from the command boundary through the fail-closed gate and typed execution to the canonical receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05131d"/><stop offset="1" stop-color="#0b2c39"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#61b9bd"/></marker>
    <marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#cf715e"/></marker>
    <style>.stage{fill:#071923;stroke:#2b5967;stroke-width:2}.box{fill:#0b2430;stroke:#376c78;stroke-width:2}.label{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#c7d9dc}.text{font:20px Inter,Segoe UI,Arial,sans-serif;fill:#d4e1e2}.small{font:17px Inter,Segoe UI,Arial,sans-serif;fill:#8fb0b5}.flow{fill:none;stroke:#61b9bd;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="600" height="1440" rx="24" fill="url(#bg)"/>

  <rect class="stage" x="24" y="28" width="552" height="260" rx="22"/>
  <circle cx="58" cy="68" r="22" fill="#0d2c39" stroke="#67d8c6" stroke-width="2"/><text x="58" y="75" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#dff4f0">1</text>
  <text class="label" x="94" y="76">Command boundary</text>
  <rect class="box" x="86" y="116" width="428" height="64" rx="14"/><text class="text" x="300" y="155" text-anchor="middle">Operator or delegated authority</text>
  <path class="flow" d="M300 180v28"/>
  <rect class="box" x="86" y="212" width="428" height="64" rx="14"/><text class="text" x="300" y="251" text-anchor="middle">Canonical typed request</text>

  <path class="flow" d="M300 288v38"/>
  <rect class="stage" x="24" y="328" width="552" height="440" rx="22"/>
  <circle cx="58" cy="370" r="22" fill="#0d2c39" stroke="#67d8c6" stroke-width="2"/><text x="58" y="377" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#dff4f0">2</text>
  <text class="label" x="94" y="378">Fail-closed gate</text>
  <rect class="box" x="86" y="416" width="428" height="84" rx="14"/><text class="text" x="300" y="451" text-anchor="middle"><tspan x="300">Shape · replay · epochs</tspan><tspan x="300" dy="27">policy · authority</tspan></text>
  <path class="flow" d="M300 500v32"/>
  <rect class="box" x="86" y="536" width="428" height="84" rx="14"/><text class="text" x="300" y="571" text-anchor="middle"><tspan x="300">Code-hash-bound</tspan><tspan x="300" dy="27">dependency reads</tspan></text>
  <path d="M300 620v36" fill="none" stroke="#cf715e" stroke-width="3" marker-end="url(#coral)"/>
  <text class="small" x="318" y="648">rejected or unavailable</text>
  <rect x="86" y="660" width="428" height="84" rx="14" fill="#291c1d" stroke="#a35e50" stroke-width="2"/><text x="300" y="694" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#e0b7ae"><tspan x="300">Revert</tspan><tspan x="300" dy="27">no authorization or state change</tspan></text>

  <rect class="stage" x="24" y="812" width="552" height="592" rx="22"/>
  <path class="flow" d="M86 578H32v364h50"/>
  <text class="small" x="40" y="644">applicable</text>
  <circle cx="58" cy="852" r="22" fill="#0d2c39" stroke="#67d8c6" stroke-width="2"/><text x="58" y="859" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#dff4f0">3</text>
  <text class="label" x="94" y="860">Typed execution</text>
  <rect class="box" x="86" y="910" width="428" height="64" rx="14"/><text class="text" x="300" y="949" text-anchor="middle">TRUST transition kernel</text>
  <path class="flow" d="M300 974v46"/>
  <polygon points="300,1024 420,1082 300,1140 180,1082" fill="#0d2c39" stroke="#559aaa" stroke-width="2"/><text class="text" x="300" y="1089" text-anchor="middle">Execution profile</text>
  <path class="flow" d="M180 1082H162v110"/><text class="small" x="74" y="1068">Native Full</text>
  <path class="flow" d="M420 1082h18v110"/><text class="small" x="430" y="1068">ERC-3643 Partial</text>
  <rect class="box" x="42" y="1196" width="240" height="72" rx="13"/><text class="small" x="162" y="1225" text-anchor="middle"><tspan x="162">Native token</tspan><tspan x="162" dy="24">balances + TRUST state</tspan></text>
  <rect class="box" x="318" y="1196" width="240" height="72" rx="13"/><text class="small" x="438" y="1225" text-anchor="middle"><tspan x="438">Adapter: TRUST + receipts</tspan><tspan x="438" dy="24">upstream token balances</tspan></text>
  <path class="flow" d="M162 1268v20h138v16"/><path class="flow" d="M438 1268v20H300v16"/>
  <rect x="86" y="1308" width="428" height="56" rx="14" fill="#0b2430" stroke="#67d8c6" stroke-width="2"/><text class="text" x="300" y="1343" text-anchor="middle">Canonical receipt emitted last</text>
</svg>
