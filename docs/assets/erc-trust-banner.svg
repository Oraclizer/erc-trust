<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">ERC-TRUST</title>
  <desc id="desc">Project banner for the independent ERC-TRUST pre-ERC candidate, featuring a calibrated protocol aperture and recomputable witness point.</desc>
  <defs>
