<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ep-title ep-desc">
  <title id="ep-title">ERC-3643 Verified Full state ownership</title>
  <desc id="ep-desc">Three-stage view. Stage one, privileged control path: an authority calls the ERC3643TrustAdapter, which is governed by a sealed ProfileGovernor. Stage two, bound upstream inputs: the adapter reads the Identity Registry and the Compliance contract, and mutates the upstream token as its exclusive Agent, while the ProfileGovernor owns and seals that token. Stage three, separated state ownership: the adapter owns TRUST state and receipts, and the token owns balances and frozen state.</desc>

  <defs>
    <linearGradient id="ep-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05131d"/>
      <stop offset=".62" stop-color="#092330"/>
      <stop offset="1" stop-color="#0b2c39"/>
    </linearGradient>
    <pattern id="ep-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#9ac6cb" stroke-width="1" opacity=".035"/>
    </pattern>
    <marker id="ep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.4 9 5 0 8.6Z" fill="#6fb6b6"/>
    </marker>
  </defs>

  <rect width="1120" height="600" rx="20" fill="url(#ep-bg)"/>
  <rect width="1120" height="600" rx="20" fill="url(#ep-grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g fill="#071923" fill-opacity=".55" stroke="#244958" stroke-width="1.4">
      <rect x="40" y="64" width="1040" height="120" rx="16"/>
      <rect x="40" y="232" width="1040" height="126" rx="16"/>
      <rect x="40" y="406" width="1040" height="140" rx="16"/>
    </g>

    <g>
      <g fill="#0d2b36" stroke="#67d8c6" stroke-width="1.4">
        <circle cx="72" cy="96" r="14"/>
        <circle cx="72" cy="264" r="14"/>
        <circle cx="72" cy="438" r="14"/>
      </g>
      <g fill="#7ae6d4" font-size="13" font-weight="700" text-anchor="middle">
        <text x="72" y="101">1</text>
        <text x="72" y="269">2</text>
        <text x="72" y="443">3</text>
      </g>
      <g fill="#b8d4d5" font-size="14" font-weight="700" letter-spacing=".4">
        <text x="96" y="101">Privileged control path</text>
        <text x="96" y="269">Bound upstream inputs</text>
        <text x="96" y="443">Separated state ownership</text>
      </g>
    </g>

    <g fill="none" stroke="#4f8f92" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ep-arrow)">
      <path d="M290 150 H370"/>
      <path d="M620 150 H700"/>
      <path d="M410 172 V212 H230 V298"/>
      <path d="M500 172 V298"/>
      <path d="M580 172 V212 H790 V298"/>
      <path d="M825 172 V250 H790 V298"/>
      <path d="M385 172 V471"/>
      <path d="M790 342 V386 H765 V471"/>
    </g>

    <g font-size="11" fill="#8fb3b8">
      <text x="320" y="205" text-anchor="middle">read</text>
      <text x="512" y="242">read</text>
      <text x="690" y="205" text-anchor="middle">exclusive Agent mutation</text>
      <text x="842" y="244">owns and seals</text>
    </g>

    <g stroke="#2b5262" stroke-width="1.4" fill="#09202b">
      <rect x="120" y="128" width="170" height="44" rx="9"/>
      <rect x="370" y="128" width="250" height="44" rx="9"/>
      <rect x="700" y="128" width="250" height="44" rx="9"/>
      <rect x="120" y="298" width="220" height="44" rx="9"/>
      <rect x="400" y="298" width="200" height="44" rx="9"/>
      <rect x="680" y="298" width="220" height="44" rx="9"/>
      <rect x="180" y="471" width="280" height="58" rx="9"/>
      <rect x="620" y="471" width="290" height="58" rx="9"/>
    </g>

    <g font-size="13" fill="#dfeded" text-anchor="middle">
      <text x="205" y="155">Authority</text>
      <text x="495" y="155">ERC3643TrustAdapter</text>
      <text x="825" y="155">Sealed ProfileGovernor</text>
      <text x="230" y="325">Identity Registry</text>
      <text x="500" y="325">Compliance</text>
      <text x="790" y="325">Upstream token</text>
      <text x="320" y="494">Adapter-owned</text>
      <text x="320" y="513">TRUST state and receipts</text>
      <text x="765" y="494">Token-owned</text>
      <text x="765" y="513">balances and frozen state</text>
    </g>
  </g>
</svg>
