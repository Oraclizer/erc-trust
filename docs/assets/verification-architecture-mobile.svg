<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2080" viewBox="0 0 600 2080" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="va-title va-desc">
  <title id="va-title">ERC-TRUST verification architecture for mobile screens</title>
  <desc id="va-desc">A vertical architecture separating abstract-model checks, implementation and bytecode checks, current evidence, unclaimed refinement, and deployment boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05131d"/><stop offset="1" stop-color="#0b2c39"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#61b9bd"/></marker>
    <marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#cf715e"/></marker>
    <style>.stage{fill:#071923;stroke:#2b5967;stroke-width:2}.box{fill:#0b2430;stroke:#376c78;stroke-width:2}.label{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#c7d9dc}.text{font:20px Inter,Segoe UI,Arial,sans-serif;fill:#d4e1e2}.small{font:17px Inter,Segoe UI,Arial,sans-serif;fill:#8fb0b5}.link{fill:none;stroke:#61b9bd;stroke-width:3}.flow{fill:none;stroke:#61b9bd;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="600" height="2080" rx="24" fill="url(#bg)"/>
  <text x="30" y="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#e5eeed">Verification architecture</text>
  <text x="30" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#8fb0b5">Checks, artifact connections, and explicit non-claims</text>

  <rect class="stage" x="24" y="112" width="552" height="548" rx="22"/>
  <circle cx="58" cy="154" r="22" fill="#0d2c39" stroke="#67d8c6" stroke-width="2"/><text x="58" y="161" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#dff4f0">1</text>
  <text class="label" x="94" y="162">Abstract model</text>
  <rect class="box" x="74" y="206" width="452" height="76" rx="14"/><text class="text" x="300" y="237" text-anchor="middle"><tspan x="300">Reusable foundations</tspan><tspan class="small" x="300" dy="26">CDSP · regulatory composition</tspan></text>
  <path class="flow" d="M300 282v40"/>
  <rect class="box" x="74" y="326" width="452" height="76" rx="14"/><text class="text" x="300" y="357" text-anchor="middle"><tspan x="300">ERC-TRUST abstract model</tspan><tspan class="small" x="300" dy="26">states · actions · outcomes</tspan></text>
  <path class="flow" d="M300 402v40"/>
  <rect class="box" x="74" y="446" width="452" height="76" rx="14"/><text class="text" x="300" y="477" text-anchor="middle"><tspan x="300">Isabelle/HOL</tspan><tspan class="small" x="300" dy="26">machine-checked logic</tspan></text>
  <path class="flow" d="M300 522v40"/>
  <rect class="box" x="74" y="566" width="452" height="60" rx="14"/><text class="text" x="300" y="603" text-anchor="middle">Checked model claims</text>

  <path d="M74 364H48v373h22" fill="none" stroke="#cf715e" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#coral)"/>
  <rect x="74" y="702" width="452" height="70" rx="14" fill="#291c1d" stroke="#a35e50" stroke-width="2" stroke-dasharray="9 8"/><text x="300" y="730" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#e0b7ae"><tspan x="300">Mapped implementation obligations</tspan><tspan x="300" dy="26">no complete refinement theorem</tspan></text>

  <rect class="stage" x="24" y="816" width="552" height="824" rx="22"/>
  <circle cx="58" cy="858" r="22" fill="#0d2c39" stroke="#67d8c6" stroke-width="2"/><text x="58" y="865" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#dff4f0">2</text>
  <text class="label" x="94" y="866">Implementation and bytecode checks</text>
  <rect class="box" x="74" y="906" width="452" height="76" rx="14"/><text class="text" x="300" y="937" text-anchor="middle"><tspan x="300">Solidity reference</tspan><tspan class="small" x="300" dy="26">actual contract implementation</tspan></text>

  <rect class="box" x="48" y="1024" width="240" height="86" rx="14"/><text class="text" x="168" y="1059" text-anchor="middle"><tspan x="168">Foundry tests</tspan><tspan class="small" x="168" dy="26">examples · fuzz · invariants</tspan></text>
  <rect class="box" x="312" y="1024" width="240" height="86" rx="14"/><text class="text" x="432" y="1059" text-anchor="middle"><tspan x="432">Certora</tspan><tspan class="small" x="432" dy="26">separate CVL rules</tspan></text>
  <path class="flow" d="M300 982 168 1020"/><path class="flow" d="M300 982 432 1020"/>

  <rect class="box" x="74" y="1152" width="452" height="78" rx="14"/><text class="text" x="300" y="1185" text-anchor="middle"><tspan x="300">Pinned solc</tspan><tspan class="small" x="300" dy="26">deterministic compiler</tspan></text>
  <path class="flow" d="M300 982v166"/>
  <path class="flow" d="M300 1230v40"/>
  <rect class="box" x="74" y="1274" width="452" height="78" rx="14"/><text class="text" x="300" y="1307" text-anchor="middle"><tspan x="300">EVM runtime bytecode</tspan><tspan class="small" x="300" dy="26">code executed on-chain</tspan></text>

  <rect class="box" x="48" y="1398" width="240" height="86" rx="14"/><text class="text" x="168" y="1433" text-anchor="middle"><tspan x="168">K Framework → KEVM</tspan><tspan class="small" x="168" dy="26">formal EVM semantics</tspan></text>
  <rect class="box" x="312" y="1398" width="240" height="86" rx="14"/><text class="text" x="432" y="1433" text-anchor="middle"><tspan x="432">Foundry-style harness</tspan><tspan class="small" x="432" dy="26">calls + expected properties</tspan></text>
  <path class="flow" d="M300 1352 168 1394"/><path class="flow" d="M300 1352 432 1394"/>
  <path class="link" d="M168 1484v32h132M432 1484v32H300"/>
  <path class="flow" d="M300 1516v24"/>
  <rect class="box" x="74" y="1544" width="452" height="66" rx="14"/><text class="text" x="300" y="1584" text-anchor="middle">Kontrol selected bytecode proofs</text>

  <path class="flow" d="M300 1640v32"/>
  <rect class="stage" x="24" y="1676" width="552" height="342" rx="22"/>
  <circle cx="58" cy="1718" r="22" fill="#0d2c39" stroke="#67d8c6" stroke-width="2"/><text x="58" y="1725" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#dff4f0">3</text>
  <text class="label" x="94" y="1726">Claim boundaries</text>
  <rect x="54" y="1758" width="492" height="62" rx="14" fill="#0b2a2b" stroke="#4ca696" stroke-width="2"/><text x="300" y="1796" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#c6e3dc">Current evidence: model proofs + bounded checks</text>
  <rect x="54" y="1840" width="492" height="62" rx="14" fill="#291c1d" stroke="#a35e50" stroke-width="2"/><text x="300" y="1878" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#e0b7ae">Not claimed: complete Isabelle → Solidity → EVM theorem</text>
  <rect x="54" y="1922" width="492" height="62" rx="14" fill="#291c1d" stroke="#a35e50" stroke-width="2"/><text x="300" y="1960" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#e0b7ae">Not included: deployment address · chain · operations</text>
  <text x="30" y="2044" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#789ca2">Solid arrows show inputs. Dashed coral marks an undischarged obligation boundary.</text>
</svg>
