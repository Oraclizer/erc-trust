<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ERC-TRUST social preview</title>
  <desc id="desc">Social preview for ERC-TRUST, Typed Regulatory Uniformity for Security Tokens.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04111a"/>
      <stop offset="0.58" stop-color="#082330"/>
      <stop offset="1" stop-color="#0b3140"/>
    </linearGradient>
    <linearGradient id="field-a" x1="66" y1="64" x2="170" y2="150" gradientUnits="userSpaceOnUse">
